<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .ink { fill: #1C1C1A; }
    @media (prefers-color-scheme: dark) { .ink { fill: #EEEEE4; } }
  </style>

  <!--
    Calligraphic "k" — broad-nib pen at ~35°
    Stroke logic:
      Stem        → medium (pen at angle to vertical)
      Upper arm   → thin  (pen narrow edge faces this direction)
      Lower arm   → thick (pen broad edge faces this direction)
  -->

  <!-- ── STEM ── -->
  <path class="ink" d="
    M 44 15
    C 44 13 48 12 50 13
    L 52 14
    C 54 15 54 17 54 19
    L 54 109
    C 54 112 51 114 49 113
    C 47 114 44 112 44 109
    Z
  "/>

  <!-- ── UPPER ARM — thin hairline diagonal ── -->
  <path class="ink" d="
    M 54 54
    L 54 48
    L 96 16
    C 98 14 101 15 100 18
    C 99 20 58 54 56 56
    Z
  "/>

  <!-- ── LOWER ARM — thick descending diagonal ── -->
  <path class="ink" d="
    M 54 66
    L 48 60
    L 96 108
    C 98 110 98 114 95 115
    C 92 116 88 114 86 112
    L 54 74
    Z
  "/>

</svg>
