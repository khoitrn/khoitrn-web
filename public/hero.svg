<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Warm dark base -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0E0B08"/>
      <stop offset="50%"  stop-color="#0C0908"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>

    <!-- Full-canvas shoji parchment — fills everything -->
    <linearGradient id="shojiAll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3A2810" stop-opacity="0.25"/>
      <stop offset="12%"  stop-color="#C8902A" stop-opacity="0.38"/>
      <stop offset="28%"  stop-color="#E8C87A" stop-opacity="0.52"/>
      <stop offset="50%"  stop-color="#D4A84A" stop-opacity="0.48"/>
      <stop offset="68%"  stop-color="#A07030" stop-opacity="0.35"/>
      <stop offset="80%"  stop-color="#4A3518" stop-opacity="0.28"/>
      <stop offset="88%"  stop-color="#2A3E18" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0F1A08" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Warm center glow — biased toward left-center where text will live -->
    <radialGradient id="warmGlow" cx="38%" cy="52%" r="50%">
      <stop offset="0%"   stop-color="#C8902A" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="#8B6520" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0C0A07" stop-opacity="0"/>
    </radialGradient>

    <!-- Garden glow at bottom -->
    <linearGradient id="gardenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3A5220" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#243E14" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0A1206" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Vignette — dark all four edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="68%">
      <stop offset="35%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.78"/>
    </radialGradient>

    <!-- Left-edge dark band — nav lives here, keep it readable -->
    <linearGradient id="leftBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="18%"  stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="32%"  stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Full-canvas shoji parchment wash -->
  <rect width="1920" height="1080" fill="url(#shojiAll)"/>

  <!-- Warm center glow -->
  <rect width="1920" height="1080" fill="url(#warmGlow)"/>

  <!-- ── SHOJI GRID — full canvas ─────────────────── -->
  <!-- Horizontal lines spanning full width -->
  <line x1="0" y1="148" x2="1920" y2="148" stroke="#0C0904" stroke-width="1.5" opacity="0.32"/>
  <line x1="0" y1="212" x2="1920" y2="212" stroke="#0C0904" stroke-width="2"   opacity="0.38"/>
  <line x1="0" y1="276" x2="1920" y2="276" stroke="#0C0904" stroke-width="1.5" opacity="0.35"/>
  <line x1="0" y1="340" x2="1920" y2="340" stroke="#0C0904" stroke-width="2.5" opacity="0.42"/>
  <line x1="0" y1="404" x2="1920" y2="404" stroke="#0C0904" stroke-width="1.5" opacity="0.38"/>
  <line x1="0" y1="468" x2="1920" y2="468" stroke="#0C0904" stroke-width="2"   opacity="0.40"/>
  <line x1="0" y1="532" x2="1920" y2="532" stroke="#0C0904" stroke-width="1.5" opacity="0.38"/>
  <line x1="0" y1="596" x2="1920" y2="596" stroke="#0C0904" stroke-width="2.5" opacity="0.42"/>
  <line x1="0" y1="660" x2="1920" y2="660" stroke="#0C0904" stroke-width="1.5" opacity="0.35"/>
  <line x1="0" y1="724" x2="1920" y2="724" stroke="#0C0904" stroke-width="2"   opacity="0.32"/>
  <line x1="0" y1="788" x2="1920" y2="788" stroke="#0C0904" stroke-width="1.5" opacity="0.28"/>
  <line x1="0" y1="840" x2="1920" y2="840" stroke="#0C0904" stroke-width="1"   opacity="0.22"/>

  <!-- Vertical dividers — full height -->
  <line x1="320"  y1="0" x2="320"  y2="860" stroke="#0C0904" stroke-width="1.5" opacity="0.28"/>
  <line x1="640"  y1="0" x2="640"  y2="860" stroke="#0C0904" stroke-width="2"   opacity="0.35"/>
  <line x1="960"  y1="0" x2="960"  y2="860" stroke="#0C0904" stroke-width="1.5" opacity="0.30"/>
  <line x1="1280" y1="0" x2="1280" y2="860" stroke="#0C0904" stroke-width="2"   opacity="0.35"/>
  <line x1="1600" y1="0" x2="1600" y2="860" stroke="#0C0904" stroke-width="1.5" opacity="0.28"/>

  <!-- Subdivider lines (thinner, inside panels) -->
  <line x1="160"  y1="148" x2="160"  y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>
  <line x1="480"  y1="148" x2="480"  y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>
  <line x1="800"  y1="148" x2="800"  y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>
  <line x1="1120" y1="148" x2="1120" y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>
  <line x1="1440" y1="148" x2="1440" y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>
  <line x1="1760" y1="148" x2="1760" y2="840" stroke="#0C0904" stroke-width="1" opacity="0.15"/>

  <!-- Light variation cells — brighter patches, backlit look -->
  <rect x="0"    y="148" width="320" height="64" fill="#F0DC9A" opacity="0.07"/>
  <rect x="640"  y="212" width="320" height="64" fill="#EED898" opacity="0.1"/>
  <rect x="960"  y="148" width="320" height="128" fill="#ECD494" opacity="0.12"/>
  <rect x="1280" y="276" width="320" height="64" fill="#F0DC9A" opacity="0.08"/>
  <rect x="320"  y="340" width="320" height="64" fill="#E8CC88" opacity="0.065"/>
  <rect x="1600" y="212" width="320" height="96" fill="#EED898" opacity="0.07"/>
  <rect x="640"  y="468" width="320" height="64" fill="#E8D090" opacity="0.06"/>
  <rect x="1120" y="532" width="160" height="64" fill="#ECD494" opacity="0.055"/>
  <rect x="0"    y="596" width="320" height="64" fill="#E8CC88" opacity="0.05"/>

  <!-- ── GARDEN / EARTH ─────────────────────────── -->
  <rect x="0" y="855" width="1920" height="225" fill="url(#gardenGlow)"/>

  <!-- Ground plane -->
  <rect x="0" y="1000" width="1920" height="80" fill="#0A1206" opacity="0.85"/>

  <!-- Full-width moss/fern silhouettes -->
  <ellipse cx="100"  cy="990" rx="80"  ry="32" fill="#182408" opacity="0.72"/>
  <ellipse cx="280"  cy="982" rx="110" ry="28" fill="#1A2A10" opacity="0.75"/>
  <ellipse cx="460"  cy="988" rx="90"  ry="30" fill="#1C2C10" opacity="0.7"/>
  <ellipse cx="650"  cy="978" rx="120" ry="32" fill="#1E3012" opacity="0.68"/>
  <ellipse cx="840"  cy="985" rx="100" ry="28" fill="#1A2E0E" opacity="0.72"/>
  <ellipse cx="1000" cy="975" rx="130" ry="35" fill="#243A14" opacity="0.7"/>
  <ellipse cx="1180" cy="983" rx="105" ry="30" fill="#1C2A10" opacity="0.68"/>
  <ellipse cx="1360" cy="987" rx="95"  ry="28" fill="#1E3012" opacity="0.65"/>
  <ellipse cx="1540" cy="978" rx="115" ry="32" fill="#182808" opacity="0.7"/>
  <ellipse cx="1720" cy="984" rx="100" ry="29" fill="#1A2C10" opacity="0.68"/>
  <ellipse cx="1880" cy="990" rx="80"  ry="26" fill="#1C2E0C" opacity="0.62"/>

  <!-- Bamboo / tall plant suggestions -->
  <rect x="382" y="875" width="3" height="130" fill="#223A12" opacity="0.32" rx="1"/>
  <rect x="768" y="870" width="2" height="135" fill="#1E3410" opacity="0.28" rx="1"/>
  <rect x="960" y="868" width="3" height="132" fill="#243E14" opacity="0.30" rx="1"/>
  <rect x="1350" y="872" width="2" height="128" fill="#223A12" opacity="0.28" rx="1"/>
  <rect x="1540" y="875" width="3" height="125" fill="#1E3410" opacity="0.25" rx="1"/>

  <!-- Ground light reflection -->
  <ellipse cx="960" cy="1010" rx="400" ry="18" fill="#3A5A20" opacity="0.15"/>

  <!-- ── SOFT CLOUDS (upper area) ───────────────── -->
  <ellipse cx="280"  cy="88"  rx="200" ry="42" fill="#D4A84A" opacity="0.035"/>
  <ellipse cx="230"  cy="72"  rx="130" ry="28" fill="#C8902A" opacity="0.025"/>
  <ellipse cx="1050" cy="68"  rx="240" ry="38" fill="#D4A84A" opacity="0.03"/>
  <ellipse cx="1010" cy="55"  rx="160" ry="26" fill="#C8902A" opacity="0.022"/>
  <ellipse cx="1620" cy="95"  rx="180" ry="36" fill="#C8902A" opacity="0.028"/>
  <ellipse cx="1580" cy="78"  rx="110" ry="22" fill="#D4A84A" opacity="0.02"/>

  <!-- ── VIGNETTE ─────────────────────────────── -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Left band darkening (nav zone) -->
  <rect width="1920" height="1080" fill="url(#leftBand)"/>

  <!-- Top/bottom edge darkening (bars overlap these) -->
  <rect x="0" y="0"    width="1920" height="90"  fill="#000000" opacity="0.55"/>
  <rect x="0" y="990"  width="1920" height="90"  fill="#000000" opacity="0.65"/>

  <!-- Grain -->
  <rect width="1920" height="1080" fill="url(#grain)" opacity="0.025"/>

</svg>
